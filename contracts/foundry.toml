[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4

# Shadow-engine forks are driven from TypeScript (packages/adapters), not from
# forge scripts. This project exists for the small amount of Solidity Bench
# owns: the probe-digest anchor and any evaluator used with ERC-8183.
[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc_mainnet = "${BSC_MAINNET_RPC_URL}"
