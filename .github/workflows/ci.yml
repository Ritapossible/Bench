name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Vercel runs only the web workspace's own build script against a clone
      # with no build output, so `npm run build` here - which builds every
      # package first, creating the dists - cannot catch a missing one. This
      # reproduces Vercel's shape, which is how a broken deploy got through:
      # apps/web gained imports on @bench/adapters, @bench/db and
      # @bench/services while its build script still compiled only @bench/core.
      - run: npm run build:vercel
      - run: npm test
      - run: npm run fmt:check

  # The integration tests skip themselves without TEST_DATABASE_URL, which means
  # a build with no database reports them as passing. They cover the guarantees
  # that only exist in Postgres - the unique index that makes hire idempotency
  # hold across instances, the jsonb codecs, the trace verified on read - so
  # they get a real database rather than a green tick for having skipped.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bench:bench@localhost:5432/bench
      DATABASE_URL: postgresql://bench:bench@localhost:5432/bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build no longer needs a reachable database - the catalog pages
      # render per request rather than at build time, which is what this job's
      # first red run taught us. The tests and the seed do need one, so the
      # schema goes up between them.
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      # The documented setup path is part of the product: if `db:seed` stops
      # working, a deployment has no catalog. It also self-checks that the
      # verified-live SQL and isVerifiedLive still agree.
      - run: npm run db:seed
      # The one flow the contest rubric names explicitly: TermiX hires from the
      # marketplace unaided. Unit tests prove the orchestrator is correct; only
      # this proves a stranger can complete the journey in a browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run start -w @bench/web &
      - run: npx wait-on http://127.0.0.1:3000 -t 60000
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: forge test
        working-directory: contracts
